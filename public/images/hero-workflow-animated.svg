<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Animated AI automation workflow</title><desc id="desc">Connected n8n-style workflow nodes route a lead through an AI agent, enrichment, and delivery.</desc><defs><radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop stop-color="#172554"/><stop offset="1" stop-color="#05070f"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="22"/></filter></defs><rect width="1024" height="1024" rx="48" fill="url(#bg)"/><g stroke="#334155" opacity=".28"><path d="M0 128h1024M0 256h1024M0 384h1024M0 512h1024M0 640h1024M0 768h1024M0 896h1024M128 0v1024M256 0v1024M384 0v1024M512 0v1024M640 0v1024M768 0v1024M896 0v1024"/></g><circle cx="512" cy="510" r="230" fill="#22d3ee" opacity=".07" filter="url(#soft)"><animate attributeName="r" values="210;245;210" dur="4s" repeatCount="indefinite"/></circle><g fill="none" stroke-linecap="round" filter="url(#glow)"><path d="M190 510C280 510 270 300 390 300s85 420 220 420 95-210 225-210" stroke="#22d3ee" stroke-width="12"/><path d="M190 510c100 0 105 210 205 210s85-420 215-420 85 210 225 210" stroke="#a78bfa" stroke-width="8" opacity=".9"/></g><g fill="#fff" filter="url(#glow)"><circle r="13" fill="#67e8f9"><animateMotion dur="3.8s" repeatCount="indefinite" path="M190 510C280 510 270 300 390 300s85 420 220 420 95-210 225-210"/></circle><circle r="10" fill="#c4b5fd"><animateMotion dur="4.6s" begin="1.2s" repeatCount="indefinite" path="M190 510c100 0 105 210 205 210s85-420 215-420 85 210 225 210"/></circle></g><g stroke-width="6"><g fill="#0e2639" stroke="#22d3ee"><rect x="90" y="440" width="200" height="140" rx="24"><animate attributeName="stroke-opacity" values="1;.5;1" dur="2.8s" repeatCount="indefinite"/></rect><circle cx="145" cy="490" r="18" fill="#22d3ee"><animate attributeName="r" values="18;23;18" dur="2.8s" repeatCount="indefinite"/></circle><text x="180" y="500" fill="#cffafe" font-family="sans-serif" font-size="24" font-weight="700">TRIGGER</text><text x="125" y="540" fill="#94a3b8" font-family="sans-serif" font-size="18">New lead</text></g><g fill="#241943" stroke="#a78bfa"><rect x="330" y="170" width="220" height="140" rx="24"><animate attributeName="stroke-opacity" values="1;.45;1" dur="3.4s" repeatCount="indefinite"/></rect><circle cx="390" cy="220" r="18" fill="#a78bfa"><animate attributeName="r" values="18;23;18" dur="3.4s" repeatCount="indefinite"/></circle><text x="425" y="230" fill="#ede9fe" font-family="sans-serif" font-size="24" font-weight="700">AI AGENT</text><text x="365" y="270" fill="#94a3b8" font-family="sans-serif" font-size="18">Understand</text></g><g fill="#123b3c" stroke="#2dd4bf"><rect x="330" y="650" width="220" height="140" rx="24"><animate attributeName="stroke-opacity" values="1;.45;1" dur="3s" begin=".6s" repeatCount="indefinite"/></rect><circle cx="390" cy="700" r="18" fill="#2dd4bf"><animate attributeName="r" values="18;23;18" dur="3s" begin=".6s" repeatCount="indefinite"/></circle><text x="425" y="710" fill="#ccfbf1" font-family="sans-serif" font-size="24" font-weight="700">ENRICH</text><text x="365" y="750" fill="#94a3b8" font-family="sans-serif" font-size="18">Add context</text></g><g fill="#1b2050" stroke="#818cf8"><rect x="700" y="440" width="220" height="140" rx="24"><animate attributeName="stroke-opacity" values="1;.45;1" dur="3.2s" begin="1s" repeatCount="indefinite"/></rect><circle cx="760" cy="490" r="18" fill="#818cf8"><animate attributeName="r" values="18;23;18" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle><text x="795" y="500" fill="#e0e7ff" font-family="sans-serif" font-size="24" font-weight="700">DELIVER</text><text x="735" y="540" fill="#94a3b8" font-family="sans-serif" font-size="18">CRM + Slack</text></g></g><g><circle cx="512" cy="510" r="38" fill="#22d3ee" opacity=".85"><animate attributeName="opacity" values=".55;1;.55" dur="2s" repeatCount="indefinite"/></circle><path d="M512 485v50m-25-25h50" stroke="#06111d" stroke-width="8" stroke-linecap="round"/></g></svg>